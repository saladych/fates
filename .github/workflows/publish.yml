name: Release and Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    
    environment: pypi
    
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest" 

      - name: Set up Python
        run: uv python install

      - name: Build package distributions
        run: uv build

      - name: Publish to PyPI
        run: uv publish
